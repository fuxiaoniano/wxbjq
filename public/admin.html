<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="app-base-path" content="/" />
    <meta name="deployment-mode" content="local" />
    <meta name="server-storage-enabled" content="true" />
    <meta name="auth-enabled" content="true" />
    <meta name="wechat-enabled" content="false" />
    <meta name="csrf-cookie-name" content="wechat_editor_csrf" />
    <title>管理后台 - 傅小念的编辑器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-page-body">
    <header class="admin-page-header">
      <a class="admin-brand" id="editorLink" href="./">
        <span class="brand-mark">傅</span>
        <span><strong>傅小念的编辑器</strong><small>管理后台</small></span>
      </a>
      <div class="admin-page-actions">
        <span id="adminIdentity"></span>
        <a class="button secondary" id="backToEditor" href="./">返回编辑器</a>
      </div>
    </header>

    <main class="admin-page-shell">
      <section class="admin-access-state" id="adminAccessState">
        <h1>正在验证管理员身份</h1>
        <p>请稍候。</p>
      </section>

      <div id="adminWorkspace" hidden>
        <div class="admin-page-title">
          <div><p class="section-kicker">站点管理</p><h1>会员与功能后台</h1></div>
          <button class="button ghost" id="refreshAdminBtn" type="button">刷新数据</button>
        </div>
        <nav class="admin-page-tabs" id="adminPageTabs" aria-label="管理视图">
          <button type="button" data-admin-view="users" aria-selected="true">用户与会员</button>
          <button type="button" data-admin-view="catalog" aria-selected="false">套餐与功能</button>
          <button type="button" data-admin-view="wechat" aria-selected="false">公众号</button>
          <button type="button" data-admin-view="audit" aria-selected="false">审计日志</button>
        </nav>
        <p class="form-feedback" id="adminPageFeedback" role="status" hidden></p>

        <section class="admin-page-panel" data-admin-panel="users">
          <label class="field admin-select"><span>选择用户</span><select id="adminPageUserSelect"></select></label>
          <div class="admin-page-grid">
            <form class="admin-form" id="adminPageUserForm">
              <h2>账号状态</h2>
              <label class="field"><span>状态</span><select name="status"><option value="active">正常</option><option value="disabled">停用</option><option value="frozen">冻结</option></select></label>
              <label class="field"><span>角色</span><select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label>
              <label class="check-row"><input name="emailVerified" type="checkbox" /><span>邮箱已验证</span></label>
              <p class="owner-protection" id="ownerProtection" hidden>站点所有者受保护，不能被冻结、降级或取消验证。</p>
              <button class="button primary" type="submit">保存账号</button>
            </form>
            <form class="admin-form" id="adminPageMembershipForm">
              <h2>会员记录</h2>
              <input name="membershipId" type="hidden" />
              <label class="field"><span>套餐</span><select name="planId"></select></label>
              <label class="field"><span>状态</span><select name="status"><option value="trialing">试用</option><option value="active">有效</option><option value="granted">管理员赠送</option><option value="paused">暂停</option><option value="canceled">取消</option><option value="expired">过期</option><option value="lifetime">永久</option></select></label>
              <label class="field"><span>开始时间</span><input name="startsAt" type="datetime-local" /></label>
              <label class="field"><span>结束时间</span><input name="endsAt" type="datetime-local" /></label>
              <button class="button primary" type="submit">保存会员</button>
            </form>
            <form class="admin-form" id="adminPageEntitlementForm">
              <h2>用户特殊授权</h2>
              <label class="field"><span>功能</span><select name="featureKey"></select></label>
              <label class="field"><span>授权</span><select name="allowed"><option value="true">允许</option><option value="false">禁止</option></select></label>
              <label class="field"><span>配额</span><input name="quotaLimit" type="number" min="0" max="1000000" placeholder="留空表示不限" /></label>
              <label class="field"><span>周期</span><select name="quotaPeriod"><option value="monthly">每月</option><option value="daily">每天</option><option value="lifetime">总量</option></select></label>
              <button class="button primary" type="submit">添加授权</button>
            </form>
          </div>
          <div class="admin-record-list" id="adminPageEntitlementList"></div>
        </section>

        <section class="admin-page-panel" data-admin-panel="catalog" hidden>
          <div class="admin-page-grid catalog-grid">
            <form class="admin-form" id="adminPagePlanForm">
              <h2>会员套餐</h2>
              <label class="field"><span>选择</span><select name="id"></select></label>
              <label class="field"><span>标识</span><input name="slug" required /></label>
              <label class="field"><span>名称</span><input name="name" required /></label>
              <label class="field"><span>说明</span><textarea name="description" rows="3"></textarea></label>
              <label class="field"><span>等级</span><input name="rank" type="number" min="0" max="10000" /></label>
              <label class="check-row"><input name="active" type="checkbox" checked /><span>启用</span></label>
              <button class="button primary" type="submit">保存套餐</button>
            </form>
            <form class="admin-form" id="adminPageFeatureForm">
              <h2>功能定义</h2>
              <label class="field"><span>选择</span><select name="id"></select></label>
              <label class="field"><span>功能标识</span><input name="key" required /></label>
              <label class="field"><span>名称</span><input name="name" required /></label>
              <label class="field"><span>说明</span><textarea name="description" rows="3"></textarea></label>
              <label class="field"><span>默认访问</span><select name="defaultAccess"><option value="public">所有人</option><option value="authenticated">登录用户</option><option value="verified">已验证用户</option><option value="plan">指定套餐</option></select></label>
              <label class="check-row"><input name="active" type="checkbox" checked /><span>启用</span></label>
              <button class="button primary" type="submit">保存功能</button>
            </form>
          </div>
          <form class="admin-form plan-feature-page-form" id="adminPagePlanFeatureForm">
            <h2>套餐功能与配额</h2>
            <div class="admin-inline-fields">
              <label class="field"><span>套餐</span><select name="planId"></select></label>
              <label class="field"><span>功能</span><select name="featureKey"></select></label>
              <label class="check-row"><input name="enabled" type="checkbox" /><span>包含</span></label>
              <label class="field"><span>配额</span><input name="quotaLimit" type="number" min="0" max="1000000" placeholder="不限" /></label>
              <label class="field"><span>周期</span><select name="quotaPeriod"><option value="monthly">每月</option><option value="daily">每天</option><option value="lifetime">总量</option></select></label>
            </div>
            <button class="button primary" type="submit">保存套餐功能</button>
          </form>
        </section>

        <section class="admin-page-panel" data-admin-panel="wechat" hidden>
          <div class="admin-section-heading"><div><h2>公众号绑定状态</h2><p>这里只展示脱敏信息，不显示 AppSecret 或 Access Token。</p></div></div>
          <div class="admin-table-wrap"><table class="admin-data-table"><thead><tr><th>用户</th><th>公众号</th><th>AppID</th><th>状态</th><th>默认</th><th>最后验证</th></tr></thead><tbody id="adminWechatRows"></tbody></table></div>
        </section>

        <section class="admin-page-panel" data-admin-panel="audit" hidden>
          <div class="admin-section-heading"><h2>审计日志</h2><button class="button ghost" id="refreshAdminAuditBtn" type="button">刷新</button></div>
          <div class="audit-list" id="adminPageAuditList"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
